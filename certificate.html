        * { box-sizing: border-box; }
        body {
            margin: 0;

        }
        .cert h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #f87171;
            font-weight: 700;
        }

            height: auto;

        }
        .meta {
            color: var(--muted);
            font-size: 15px;
            text-align: left;
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
        }

            color: var(--text);
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
